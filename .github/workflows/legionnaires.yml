name: Turkish players abroad (weekly)

on:
  schedule:
    - cron: '41 6 * * 2'   # Tuesdays 06:41 UTC, after the European weekend and Monday matches
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: super-lig-data
  cancel-in-progress: false

jobs:
  legionnaires:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Offline tests (no API requests)
        run: python -m unittest discover -s tests -v
      - name: Refresh Turkish players abroad (max 40 requests, shared 100/day cap)
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          API_DAILY_LIMIT: '100'
          SEASON: ${{ vars.CURRENT_SEASON }}
        run: |
          if [ -z "$APIFOOTBALL_KEY" ]; then echo '::error::Missing APIFOOTBALL_KEY secret'; exit 1; fi
          if [ -z "$SEASON" ]; then echo '::error::Set the CURRENT_SEASON repository variable'; exit 1; fi
          python scripts/legionnaires.py --season "$SEASON" --max-requests 40
      - name: Rebuild public JSON (no API requests)
        run: python scripts/rebuild_data.py --allow-empty
      - name: Save data
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Turkish players abroad'
            git pull --rebase --autostash
            git push
          fi
