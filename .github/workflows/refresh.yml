name: Refresh data and publish

on:
  schedule:
    - cron: '17 8 * * *'    # 08:17 UTC daily: results of the previous evening
    - cron: '47 22 * * *'   # 22:47 UTC daily: same-day results (Süper Lig evening matches end ~21:00 UTC)
    # GitHub may delay scheduled runs. Each run costs about 3 API requests.
  workflow_dispatch:
    inputs:
      season:
        description: 'Season start year (2026 = 2026–27). Blank uses the CURRENT_SEASON variable.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: super-lig-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Offline tests (no API requests)
        run: python -m unittest discover -s tests -v
      - name: Refresh changed fixtures
        # A season the API plan does not include must not stop publishing what is already cached.
        continue-on-error: true
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          APIFOOTBALL_LEAGUE_ID: ${{ vars.APIFOOTBALL_LEAGUE_ID }}
          API_DAILY_LIMIT: '100'
          SEASON: ${{ inputs.season || vars.CURRENT_SEASON }}
        run: |
          if [ -z "$APIFOOTBALL_KEY" ]; then echo '::error::Missing APIFOOTBALL_KEY secret'; exit 1; fi
          if [ -z "$APIFOOTBALL_LEAGUE_ID" ]; then echo '::error::Missing APIFOOTBALL_LEAGUE_ID repository variable'; exit 1; fi
          if [ -z "$SEASON" ]; then echo '::error::Set the CURRENT_SEASON repository variable or give a season'; exit 1; fi
          python scripts/update.py --season "$SEASON"
      - name: Rebuild season files (no API requests)
        run: python scripts/rebuild_data.py --allow-empty
      - name: Fit model and backtest when enough data exists
        run: python scripts/build_model.py --allow-not-ready
      - name: Save API cache and generated data
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Süper Lig data'
            git pull --rebase --autostash
            git push
          fi
      - name: Build static site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then echo '::error::Set the SITE_URL repository variable to the Pages URL'; exit 1; fi
          python scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
